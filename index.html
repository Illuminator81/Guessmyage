<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess My Age - Gallery</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-weight: 600;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }
        .card-content {
            padding: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Guess My Age Gallery</h1>

    <div class="gallery">
        <!-- Duplicate this block for each image in your folder -->
        <div class="card">
            <img src="Photo-001.jpg" alt="Photo 1">
            <div class="card-content">
                <p>Photo 1</p>
            </div>
        </div>

        <div class="card">
            <img src="Photo-002.jpg" alt="Photo 2">
            <div class="card-content">
                <p>Photo 2</p>
            </div>
        </div>
    </div>

</body>
</html>
